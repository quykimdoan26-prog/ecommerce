<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Quý Shop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .sidebar a { color: white; text-decoration: none; display: block; padding: 10px 15px; margin: 5px 0; border-radius: 8px; transition: 0.3s; }
        .sidebar a:hover { background: rgba(255,255,255,0.2); }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .stat-card { text-align: center; padding: 30px; }
        .stat-number { font-size: 2.5rem; font-weight: bold; color: #667eea; }
        .stat-label { color: #6c757d; margin-top: 10px; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px 0; margin-bottom: 30px; }
        .header h1 { margin: 0; font-weight: bold; }
    </style>
</head>
<body>
    <div class="row no-gutters">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar">
            <h4 class="text-white mb-4">📊 Admin</h4>
            <a href="/admin/dashboard">Dashboard</a>
            <a href="/admin/products">Quản Lý Sản Phẩm</a>
            <a href="/admin/orders">Quản Lý Đơn Hàng</a>
            <a href="/">Về Trang Chủ</a>
            <hr class="bg-white">
            <form action="/logout" method="post">
                <button class="btn btn-light w-100" type="submit">Đăng Xuất</button>
            </form>
        </div>

        <!-- Main Content -->
        <div class="col-md-10">
            <div class="header">
                <div class="container">
                    <h1>📈 Dashboard</h1>
                    <p>Quản lý hệ thống bán hàng</p>
                </div>
            </div>

            <div class="container mt-4">
                <div class="row mb-4">
                    <div class="col-md-4">
                        <div class="card stat-card">
                            <div class="stat-number" th:text="${totalProducts}">0</div>
                            <div class="stat-label">Sản Phẩm</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card stat-card">
                            <div class="stat-number" th:text="${pendingOrders}">0</div>
                            <div class="stat-label">Đơn Hàng Chờ Xử Lý</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card stat-card">
                            <div class="stat-number">💰</div>
                            <div class="stat-label">Doanh Thu</div>
                        </div>
                    </div>
                </div>

                <div class="card p-4">
                    <h5>Quản Lý Nhanh</h5>
                    <a href="/admin/products/add" class="btn btn-primary">➕ Thêm Sản Phẩm</a>
                    <a href="/admin/products" class="btn btn-info">📦 Xem Sản Phẩm</a>
                    <a href="/admin/orders" class="btn btn-warning">📋 Xem Đơn Hàng</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
