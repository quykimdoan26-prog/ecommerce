<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product != null} ? ${product.name} + ' · Quý Shop Admin' : 'Chi tiết sản phẩm · Quý Shop Admin'">Chi tiết sản phẩm · Quý Shop Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1C2430;
            --ink-soft: #4B5361;
            --cream: #FAF7F2;
            --sand: #EDE6D9;
            --sand-line: #DCD2BF;
            --gold: #B8873D;
            --gold-deep: #96692A;
            --clay: #B0402C;
            --sage: #5C6E5A;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            color: var(--ink);
            background: var(--cream);
        }

        a { color: inherit; }

        .layout {
            display: grid;
            grid-template-columns: 232px 1fr;
            min-height: 100vh;
        }

        /* ---------- Sidebar (shared) ---------- */
        .sidebar {
            background: var(--ink);
            padding: 28px 20px;
            display: flex;
            flex-direction: column;
        }

        .brand-mark {
            display: flex;
            align-items: baseline;
            gap: 9px;
            text-decoration: none;
            margin-bottom: 8px;
            padding: 0 6px;
        }

        .brand-mark .tag {
            width: 10px;
            height: 10px;
            border: 1.5px solid var(--gold);
            border-radius: 2px;
            transform: rotate(45deg);
            position: relative;
            top: -1px;
        }

        .brand-mark span {
            font-family: 'Fraunces', serif;
            font-size: 18px;
            font-weight: 500;
            color: var(--cream);
        }

        .sidebar-tag {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--gold);
            padding: 0 6px;
            margin-bottom: 30px;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex: 1;
        }

        .sidebar-nav a {
            font-size: 14.5px;
            color: rgba(250, 247, 242, 0.72);
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 6px;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .sidebar-nav a:hover { background: rgba(250, 247, 242, 0.06); color: var(--cream); }

        .sidebar-nav a.active {
            background: rgba(184, 135, 61, 0.15);
            color: var(--cream);
            font-weight: 600;
        }

        .sidebar-divider {
            height: 1px;
            background: rgba(250, 247, 242, 0.1);
            margin: 16px 6px;
        }

        .sidebar-nav a.exit { color: rgba(250, 247, 242, 0.55); }

        .btn-logout {
            width: 100%;
            margin-top: 8px;
            padding: 10px 12px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            color: var(--ink);
            background: var(--cream);
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-logout:hover { background: #EDE6D9; }

        /* ---------- Main ---------- */
        .main { display: flex; flex-direction: column; min-width: 0; }

        .topbar {
            padding: 32px 40px;
            border-bottom: 1px solid var(--sand-line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .topbar h1 {
            font-family: 'Fraunces', serif;
            font-size: 26px;
            font-weight: 500;
            margin: 0 0 6px;
        }

        .topbar p {
            font-size: 14.5px;
            color: var(--ink-soft);
            margin: 0;
        }

        .nav-back {
            font-size: 14px;
            font-weight: 600;
            color: var(--ink-soft);
            text-decoration: none;
            border: 1px solid var(--sand-line);
            border-radius: 6px;
            padding: 9px 16px;
            white-space: nowrap;
        }

        .nav-back:hover { border-color: var(--gold); color: var(--gold-deep); }

        .content { padding: 40px; }

        /* ---------- Product card ---------- */
        .product-card {
            background: #fff;
            border: 1px solid var(--sand-line);
            border-radius: 10px;
            padding: 40px;
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 44px;
            max-width: 920px;
        }

        .product-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 8px;
            background: var(--sand);
            border: 1px solid var(--sand-line);
        }

        .category-pill {
            display: inline-block;
            font-size: 12px;
            font-weight: 600;
            color: var(--gold-deep);
            background: #FBF3E6;
            padding: 5px 13px;
            border-radius: 20px;
            margin-bottom: 16px;
        }

        .product-title {
            font-family: 'Fraunces', serif;
            font-size: 27px;
            font-weight: 500;
            margin: 0 0 12px;
            line-height: 1.25;
        }

        .product-desc {
            font-size: 15px;
            line-height: 1.7;
            color: var(--ink-soft);
            margin: 0 0 26px;
        }

        .product-price {
            font-family: 'Fraunces', serif;
            font-size: 28px;
            font-weight: 600;
            color: var(--gold-deep);
            margin: 0 0 24px;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding-top: 22px;
            border-top: 1px solid var(--sand-line);
        }

        .meta-item .label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--ink-soft);
            margin-bottom: 6px;
        }

        .meta-item .value {
            font-size: 15px;
            font-weight: 600;
            color: var(--ink);
        }

        .stock-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .stock-tag::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--sage);
        }

        .not-found {
            text-align: center;
            padding: 80px 24px;
            color: var(--ink-soft);
        }

        .not-found h3 {
            font-family: 'Fraunces', serif;
            font-weight: 500;
            font-size: 20px;
            color: var(--ink);
            margin: 0 0 8px;
        }

        @media (max-width: 860px) {
            .layout { grid-template-columns: 1fr; }
            .topbar, .content { padding-left: 24px; padding-right: 24px; }
            .product-card { grid-template-columns: 1fr; padding: 28px; }
        }
    </style>
</head>
<body>
    <div class="layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <a class="brand-mark" href="/">
                <span class="tag"></span>
                <span>Quý Shop</span>
            </a>
            <p class="sidebar-tag">QUẢN TRỊ</p>

            <nav class="sidebar-nav">
                <a href="/admin/dashboard">Dashboard</a>
                <a href="/admin/products" class="active">Quản lý sản phẩm</a>
                <a href="/admin/orders">Quản lý đơn hàng</a>
                <a href="/admin/users">Tài khoản khách hàng</a>

                <div class="sidebar-divider"></div>
                <a href="/" class="exit">Về trang chủ</a>
            </nav>

            <form action="/logout" method="post">
                <button class="btn-logout" type="submit">Đăng xuất</button>
            </form>
        </aside>

        <!-- Main -->
        <div class="main">
            <div class="topbar">
                <div>
                    <h1>Chi tiết sản phẩm</h1>
                    <p>Xem thông tin đầy đủ của sản phẩm.</p>
                </div>
                <a href="/admin/products" class="nav-back">&larr; Danh sách sản phẩm</a>
            </div>

            <div class="content">
                <div class="product-card" th:if="${product != null}">
                    <img th:src="${product.imageUrl}" class="product-image" alt="Ảnh sản phẩm">
                    <div>
                        <span class="category-pill" th:text="${product.category.name}"></span>
                        <h1 class="product-title" th:text="${product.name}"></h1>
                        <p class="product-desc" th:text="${product.description}"></p>
                        <p class="product-price" th:text="'₫' + ${#numbers.formatInteger(product.price, 0, 'COMMA')}"></p>

                        <div class="meta-grid">
                            <div class="meta-item">
                                <span class="label">Tồn kho</span>
                                <span class="value stock-tag" th:text="${product.quantity} + ' sản phẩm'"></span>
                            </div>
                            <div class="meta-item">
                                <span class="label">Danh mục</span>
                                <span class="value" th:text="${product.category.name}"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="not-found" th:if="${product == null}">
                    <h3>Không tìm thấy sản phẩm</h3>
                    <p>Sản phẩm này có thể đã bị xoá hoặc không tồn tại.</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
