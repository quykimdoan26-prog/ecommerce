<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ Hàng · Quý Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1C2430;
            --ink-soft: #4B5361;
            --cream: #FAF7F2;
            --sand: #EDE6D9;
            --sand-line: #DCD2BF;
            --gold: #B8873D;
            --gold-deep: #96692A;
            --clay: #B0402C;
            --sage: #5C6E5A;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            color: var(--ink);
            background: var(--cream);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a { color: inherit; text-decoration: none; }

        /* ---------- Navbar (Khách hàng) ---------- */
        .navbar {
            background: var(--ink);
            padding: 16px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-mark {
            display: flex;
            align-items: baseline;
            gap: 9px;
            text-decoration: none;
        }

        .brand-mark .tag {
            width: 10px;
            height: 10px;
            border: 1.5px solid var(--gold);
            border-radius: 2px;
            transform: rotate(45deg);
            position: relative;
            top: -1px;
        }

        .brand-mark span {
            font-family: 'Fraunces', serif;
            font-size: 20px;
            font-weight: 500;
            color: var(--cream);
        }

        .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .nav-links a {
            font-size: 14.5px;
            font-weight: 500;
            color: rgba(250, 247, 242, 0.72);
            transition: color 0.15s ease;
        }

        .nav-links a:hover { color: var(--cream); }

        .btn-logout {
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            color: var(--ink);
            background: var(--cream);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .btn-logout:hover { background: #EDE6D9; }

        /* ---------- Layout Container ---------- */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 24px 80px;
            flex: 1;
            width: 100%;
        }

        .page-header { margin-bottom: 32px; }
        
        .page-header h1 {
            font-family: 'Fraunces', serif;
            font-size: 32px;
            font-weight: 500;
            margin: 0;
        }

        /* ---------- Giỏ hàng trống ---------- */
        .empty-cart {
            background: #fff;
            border: 1px dashed var(--sand-line);
            border-radius: 10px;
            padding: 80px 20px;
            text-align: center;
        }

        .empty-cart h5 {
            font-family: 'Fraunces', serif;
            font-size: 22px;
            margin: 0 0 12px;
        }

        .empty-cart p { color: var(--ink-soft); margin: 0 0 24px; }
        .empty-cart a { color: var(--gold-deep); font-weight: 600; text-decoration: underline; }

        /* ---------- Grid Giỏ hàng ---------- */
        .cart-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 32px;
            align-items: start;
        }

        /* Danh sách Item */
        .cart-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .cart-item {
            background: #fff;
            border: 1px solid var(--sand-line);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .item-img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
            background: var(--sand);
        }

        .item-info { flex: 1; }
        
        .item-info h5 {
            font-size: 16px;
            font-weight: 600;
            margin: 0 0 6px;
            color: var(--ink);
        }

        .item-info .desc {
            font-size: 13.5px;
            color: var(--ink-soft);
            margin: 0 0 12px;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .item-price {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            color: var(--gold-deep);
            font-size: 14.5px;
        }

        .item-actions {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        /* Form số lượng */
        .qty-form {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 0;
        }

        .qty-input {
            width: 56px;
            padding: 8px;
            text-align: center;
            border: 1px solid var(--sand-line);
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }
        
        .qty-input:focus { border-color: var(--gold); }

        .btn-update {
            background: var(--cream);
            border: 1px solid var(--sand-line);
            color: var(--ink);
            width: 34px;
            height: 34px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-update:hover { background: var(--sand); }

        .item-total {
            text-align: right;
            min-width: 100px;
        }

        .item-total .label { font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
        .item-total .amount { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; }

        .form-remove { margin: 0; }
        
        .btn-remove {
            background: transparent;
            border: none;
            color: var(--ink-soft);
            font-size: 16px;
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            transition: all 0.15s;
        }

        .btn-remove:hover { color: var(--clay); background: #FBF0ED; }

        /* ---------- Cart Summary ---------- */
        .summary-card {
            background: #fff;
            border: 1px solid var(--sand-line);
            border-radius: 10px;
            padding: 28px;
            position: sticky;
            top: 96px;
        }

        .summary-card h4 {
            font-family: 'Fraunces', serif;
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--sand-line);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 14.5px;
            margin-bottom: 16px;
            color: var(--ink-soft);
        }

        .summary-row.total {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px dashed var(--sand-line);
            color: var(--ink);
            font-weight: 600;
            align-items: center;
        }

        .summary-row.total .amount {
            font-family: 'Fraunces', serif;
            font-size: 22px;
            color: var(--gold-deep);
        }

        /* Buttons */
        .btn-checkout {
            display: block;
            width: 100%;
            text-align: center;
            background: var(--ink);
            color: var(--cream);
            font-size: 15px;
            font-weight: 600;
            padding: 14px;
            border-radius: 6px;
            border: none;
            margin-bottom: 12px;
            transition: background 0.15s ease;
            cursor: pointer;
        }

        .btn-checkout:hover { background: #2A3444; }

        .btn-outline {
            display: block;
            width: 100%;
            text-align: center;
            background: #fff;
            color: var(--ink);
            font-size: 14px;
            font-weight: 600;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--sand-line);
            margin-bottom: 16px;
            transition: all 0.15s ease;
        }

        .btn-outline:hover { border-color: var(--gold); color: var(--gold-deep); }

        .form-clear { margin: 0; }
        
        .btn-clear {
            display: block;
            width: 100%;
            background: transparent;
            border: none;
            color: var(--clay);
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
        }

        .btn-clear:hover { color: #8A2D1C; }

        @media (max-width: 900px) {
            .cart-layout { grid-template-columns: 1fr; }
            .cart-item { flex-direction: column; align-items: stretch; gap: 16px; }
            .item-img { width: 100%; height: 200px; }
            .item-actions { justify-content: space-between; border-top: 1px solid var(--sand-line); padding-top: 16px; }
            .navbar { padding: 16px 20px; }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a class="brand-mark" href="/">
            <span class="tag"></span>
            <span>Quý Shop</span>
        </a>
        <div class="nav-links">
            <a href="/products">Sản Phẩm</a>
            <a href="/orders">Đơn Hàng Của Tôi</a>
            <form action="/logout" method="post" style="margin: 0;">
                <button class="btn-logout" type="submit">Đăng xuất</button>
            </form>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <div class="page-header">
            <h1>Giỏ hàng của bạn</h1>
        </div>

        <!-- Trạng thái trống -->
        <div th:if="${items.isEmpty()}" class="empty-cart">
            <h5>Giỏ hàng đang trống</h5>
            <p>Khám phá các sản phẩm nổi bật của chúng tôi và thêm vào giỏ.</p>
            <a href="/products">Tiếp tục mua sắm</a>
        </div>

        <!-- Có sản phẩm -->
        <div th:if="${!items.isEmpty()}" class="cart-layout">
            
            <!-- Danh sách -->
            <div class="cart-list">
                <div th:each="item : ${items}" class="cart-item">
                    <img th:src="${item.product.imageUrl}" class="item-img" alt="Sản phẩm">
                    
                    <div class="item-info">
                        <h5 th:text="${item.product.name}"></h5>
                        <p class="desc" th:text="${item.product.description}"></p>
                        <div class="item-price" th:text="'₫' + ${#numbers.formatInteger(item.unitPrice, 0, 'COMMA')}"></div>
                    </div>

                    <div class="item-actions">
                        <!-- Form cập nhật SL -->
                        <form th:action="'/cart/update/' + ${item.id}" method="post" class="qty-form">
                            <input type="number" name="quantity" class="qty-input" th:value="${item.quantity}" min="1" max="100">
                            <button type="submit" class="btn-update" title="Cập nhật">✓</button>
                        </form>

                        <!-- Tổng tiền món -->
                        <div class="item-total">
                            <div class="label">Thành tiền</div>
                            <div class="amount" th:text="'₫' + ${#numbers.formatInteger(item.unitPrice * item.quantity, 0, 'COMMA')}"></div>
                        </div>

                        <!-- Nút Xóa -->
                        <form th:action="'/cart/remove/' + ${item.id}" method="post" class="form-remove">
                            <button type="submit" class="btn-remove" title="Xóa khỏi giỏ">✕</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tổng kết Sidebar -->
            <aside class="summary-card">
                <h4>Tóm tắt đơn hàng</h4>
                
                <div class="summary-row">
                    <span>Số lượng sản phẩm:</span>
                    <strong th:text="${items.size()} + ' món'"></strong>
                </div>
                <div class="summary-row">
                    <span>Phí giao hàng:</span>
                    <span>Tính ở bước sau</span>
                </div>
                
                <div class="summary-row total">
                    <span>Tổng cộng:</span>
                    <span class="amount" th:text="'₫' + ${#numbers.formatInteger(total, 0, 'COMMA')}"></span>
                </div>

                <a href="/checkout" class="btn-checkout">Tiến hành thanh toán</a>
                <a href="/products" class="btn-outline">Tiếp tục mua sắm</a>
                
                <form th:action="@{/cart/clear}" method="post" class="form-clear">
                    <button type="submit" class="btn-clear" onclick="return confirm('Bạn có chắc chắn muốn xóa toàn bộ giỏ hàng?')">Xóa tất cả giỏ hàng</button>
                </form>
            </aside>
            
        </div>
    </div>

</body>
</html>
