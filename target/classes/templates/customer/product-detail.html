<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Sản Phẩm - Quý Shop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .product-detail { background: white; padding: 40px; border-radius: 12px; }
        .product-image { max-width: 400px; height: auto; border-radius: 12px; }
        .product-title { font-size: 2rem; font-weight: bold; color: #2c3e50; }
        .product-price { font-size: 1.8rem; color: #27ae60; font-weight: bold; }
        .btn-add-cart { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; padding: 12px 30px; font-size: 1.1rem; font-weight: bold; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">🛍️ ShopNow</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/products">Sản Phẩm</a></li>
                    <li class="nav-item" sec:authorize="isAuthenticated()"><a class="nav-link" href="/orders">Đơn Hàng</a></li>
                </ul>
            </div>
            <div class="ms-auto">
                <a href="/cart" class="btn btn-light btn-sm me-2" sec:authorize="isAuthenticated()">🛒 Giỏ Hàng</a>
                <a href="/products" class="btn btn-light btn-sm">← Quay Lại</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div th:if="${param.added}" class="alert alert-success">
            ✅ Sản phẩm đã thêm vào giỏ hàng! <a href="/cart">Xem giỏ hàng</a>
        </div>

        <div class="row">
            <div class="col-md-6">
                <img th:src="${product.imageUrl}" class="product-image" alt="${product.name}">
            </div>
            <div class="col-md-6">
                <div class="product-detail">
                    <h1 class="product-title" th:text="${product.name}"></h1>
                    <p class="text-muted" th:text="${product.description}"></p>
                    
                    <div class="my-4">
                        <span class="badge" th:classappend="${product.quantity > 0 ? 'bg-success' : 'bg-danger'}" 
                              th:text="${product.quantity > 0 ? 'Còn Hàng' : 'Hết Hàng'}"></span>
                    </div>

                    <div class="my-4">
                        <h3 class="product-price" th:text="'₫' + ${#numbers.formatInteger(product.price, 0, 'COMMA')}"></h3>
                    </div>

                    <div class="my-4" sec:authorize="!isAuthenticated()">
                        <div class="alert alert-info">
                            🔐 Bạn cần <a href="/auth/login">đăng nhập</a> để mua hàng
                        </div>
                        <a href="/auth/login" class="btn btn-primary btn-lg w-100">Đăng Nhập</a>
                    </div>

                    <div class="my-4" sec:authorize="isAuthenticated()">
                        <form method="post" th:action="@{/products/add-to-cart}">
                            <input type="hidden" name="productId" th:value="${product.id}">
                            <div class="input-group mb-3" style="width: 200px;">
                                <input type="number" class="form-control" name="quantity" value="1" min="1" th:max="${product.quantity}">
                                <button class="btn btn-primary btn-add-cart" type="submit" th:disabled="${product.quantity == 0}">
                                    🛒 Thêm Vào Giỏ
                                </button>
                            </div>
                        </form>
                    </div>

                    <div class="my-4 alert alert-info">
                        <strong>📦 Số Lượng Kho:</strong> <span th:text="${product.quantity}"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
