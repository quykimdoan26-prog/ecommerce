<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Sản Phẩm - Quý Shop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .product-card { transition: transform 0.3s, box-shadow 0.3s; border: none; border-radius: 12px; overflow: hidden; }
        .product-card:hover { transform: translateY(-8px); box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        .product-image { height: 250px; object-fit: cover; }
        .product-price { font-size: 1.3rem; color: #007bff; font-weight: bold; }
        .section-title { font-size: 2rem; font-weight: bold; margin-bottom: 30px; color: #2c3e50; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">🛍️ ShopNow</a>
            <div class="ms-auto">
                <a href="/" class="btn btn-light btn-sm">← Quay Lại</a>
            </div>
        </div>
    </nav>

    <section class="py-5">
        <div class="container">
            <h1 class="section-title">Tất Cả Sản Phẩm</h1>
            <div class="row">
                <div th:each="product : ${products}" class="col-md-6 col-lg-3 mb-4">
                    <div class="card product-card">
                        <img th:src="${product.imageUrl}" class="card-img-top product-image" alt="${product.name}">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${product.name}"></h5>
                            <p class="card-text text-muted" th:text="${product.description}"></p>
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="product-price" th:text="'₫' + ${#numbers.formatInteger(product.price, 0, 'COMMA')}"></span>
                                <a th:href="'/products/' + ${product.id}" class="btn btn-primary btn-sm">Chi Tiết</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
