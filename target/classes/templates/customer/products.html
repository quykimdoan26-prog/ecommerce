<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản phẩm · Quý Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1C2430;
            --ink-soft: #4B5361;
            --cream: #FAF7F2;
            --sand: #EDE6D9;
            --sand-line: #DCD2BF;
            --gold: #B8873D;
            --gold-deep: #96692A;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            color: var(--ink);
            background: var(--cream);
        }

        a { color: inherit; }

        /* ---------- Navbar ---------- */
        .nav { background: var(--ink); }

        .nav-inner {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 24px;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-mark {
            display: flex;
            align-items: baseline;
            gap: 9px;
            text-decoration: none;
        }

        .brand-mark .tag {
            width: 10px;
            height: 10px;
            border: 1.5px solid var(--gold);
            border-radius: 2px;
            transform: rotate(45deg);
            position: relative;
            top: -1px;
        }

        .brand-mark span {
            font-family: 'Fraunces', serif;
            font-size: 19px;
            font-weight: 500;
            color: var(--cream);
        }

        .nav-back {
            font-size: 14px;
            color: rgba(250, 247, 242, 0.75);
            text-decoration: none;
        }

        .nav-back:hover { color: var(--cream); }

        /* ---------- Page head ---------- */
        .page-head {
            max-width: 1180px;
            margin: 0 auto;
            padding: 48px 24px 32px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            border-bottom: 1px solid var(--sand-line);
        }

        .page-head h1 {
            font-family: 'Fraunces', serif;
            font-size: clamp(28px, 3.4vw, 36px);
            font-weight: 500;
            margin: 0 0 6px;
        }

        .page-head p {
            font-size: 14.5px;
            color: var(--ink-soft);
            margin: 0;
        }

        .count-badge {
            font-size: 13px;
            font-weight: 600;
            color: var(--gold-deep);
            border: 1px solid var(--sand-line);
            border-radius: 20px;
            padding: 7px 16px;
            white-space: nowrap;
        }

        /* ---------- Product grid ---------- */
        .grid-wrap {
            max-width: 1180px;
            margin: 0 auto;
            padding: 40px 24px 96px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
        }

        .product-card {
            display: flex;
            flex-direction: column;
            background: #fff;
            border: 1px solid var(--sand-line);
            border-radius: 8px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }

        .product-card:hover {
            border-color: var(--gold);
            transform: translateY(-3px);
        }

        .product-image {
            height: 210px;
            width: 100%;
            object-fit: cover;
            background: var(--sand);
            display: block;
        }

        .product-body {
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .product-title {
            font-size: 15.5px;
            font-weight: 600;
            margin: 0;
            line-height: 1.4;
        }

        .product-desc {
            font-size: 13.5px;
            color: var(--ink-soft);
            margin: 0;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-foot {
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 8px;
        }

        .product-price {
            font-family: 'Fraunces', serif;
            font-size: 17px;
            font-weight: 600;
            color: var(--gold-deep);
        }

        .product-link {
            font-size: 13px;
            font-weight: 600;
            color: var(--ink);
            border-bottom: 1px solid var(--ink);
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 80px 24px;
            color: var(--ink-soft);
        }

        .empty-state h3 {
            font-family: 'Fraunces', serif;
            font-weight: 500;
            font-size: 20px;
            color: var(--ink);
            margin: 0 0 8px;
        }

        @media (max-width: 900px) {
            .product-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 520px) {
            .product-grid { grid-template-columns: 1fr; }
            .page-head { flex-direction: column; align-items: flex-start; gap: 12px; }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="nav">
        <div class="nav-inner">
            <a class="brand-mark" href="/">
                <span class="tag"></span>
                <span>Quý Shop</span>
            </a>
            <a href="/" class="nav-back">&larr; Quay lại</a>
        </div>
    </nav>

    <!-- Page head -->
    <div class="page-head">
        <div>
            <h1>Tất cả sản phẩm</h1>
            <p>Duyệt toàn bộ sản phẩm hiện có tại Quý Shop.</p>
        </div>
        <span class="count-badge" th:text="${#lists.size(products)} + ' sản phẩm'">0 sản phẩm</span>
    </div>

    <!-- Product grid -->
    <div class="grid-wrap">
        <div class="product-grid" th:if="${not #lists.isEmpty(products)}">
            <a th:each="product : ${products}" th:href="'/products/' + ${product.id}" class="product-card">
                <img th:src="${product.imageUrl}" class="product-image" th:alt="${product.name}">
                <div class="product-body">
                    <p class="product-title" th:text="${product.name}"></p>
                    <p class="product-desc" th:text="${product.description}"></p>
                    <div class="product-foot">
                        <span class="product-price" th:text="'₫' + ${#numbers.formatInteger(product.price, 0, 'COMMA')}"></span>
                        <span class="product-link">Chi tiết</span>
                    </div>
                </div>
            </a>
        </div>

        <div class="empty-state" th:if="${#lists.isEmpty(products)}">
            <h3>Chưa có sản phẩm nào</h3>
            <p>Hãy quay lại sau, Quý Shop sẽ sớm cập nhật thêm sản phẩm mới.</p>
        </div>
    </div>
</body>
</html>
