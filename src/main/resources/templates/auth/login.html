<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Quý Shop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; }
        .login-container { max-width: 400px; margin: 0 auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .login-container h2 { text-align: center; color: #667eea; margin-bottom: 30px; font-weight: bold; }
        .form-control { border-radius: 8px; border: 1px solid #ddd; padding: 10px 15px; }
        .form-control:focus { border-color: #667eea; box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25); }
        .btn-login { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; padding: 10px; font-weight: bold; border-radius: 8px; }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }
        .text-center a { color: #667eea; text-decoration: none; }
        .text-center a:hover { text-decoration: underline; }
        .alert { border-radius: 8px; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>🔐 Đăng Nhập</h2>
        
        <div th:if="${param.success}" class="alert alert-success">
            ✅ Đăng ký thành công! Hãy đăng nhập.
        </div>
        <div th:if="${param.error}" class="alert alert-danger">
            ❌ Tên đăng nhập hoặc mật khẩu không đúng!
        </div>
        <div th:if="${param.logout}" class="alert alert-info">
            ℹ️ Đã đăng xuất thành công!
        </div>

        <form method="post" action="/login">
            <div class="mb-3">
                <label for="username" class="form-label">Tên Đăng Nhập</label>
                <input type="text" class="form-control" id="username" name="username" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Mật Khẩu</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-login w-100 btn-primary">Đăng Nhập</button>
        </form>

        <hr>
        <p class="text-center mt-3">Chưa có tài khoản? <a href="/auth/register">Đăng ký ngay</a></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
