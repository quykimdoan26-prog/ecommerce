<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn hàng của tôi · Quý Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1C2430;
            --ink-soft: #4B5361;
            --cream: #FAF7F2;
            --sand: #EDE6D9;
            --sand-line: #DCD2BF;
            --gold: #B8873D;
            --gold-deep: #96692A;
            --clay: #B0402C;
            --sage: #5C6E5A;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            color: var(--ink);
            background: var(--cream);
        }

        a { color: inherit; }

        /* ---------- Navbar ---------- */
        .nav { background: var(--ink); }

        .nav-inner {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 24px;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-mark {
            display: flex;
            align-items: baseline;
            gap: 9px;
            text-decoration: none;
        }

        .brand-mark .tag {
            width: 10px;
            height: 10px;
            border: 1.5px solid var(--gold);
            border-radius: 2px;
            transform: rotate(45deg);
            position: relative;
            top: -1px;
        }

        .brand-mark span {
            font-family: 'Fraunces', serif;
            font-size: 19px;
            font-weight: 500;
            color: var(--cream);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-actions a {
            font-size: 14px;
            color: rgba(250, 247, 242, 0.75);
            text-decoration: none;
        }

        .nav-actions a:hover { color: var(--cream); }

        .nav-logout-btn {
            background: none;
            border: none;
            font-family: inherit;
            font-size: 14px;
            color: rgba(250, 247, 242, 0.75);
            cursor: pointer;
            padding: 0;
        }

        .nav-logout-btn:hover { color: var(--cream); }

        /* ---------- Page head ---------- */
        .wrap {
            max-width: 900px;
            margin: 0 auto;
            padding: 48px 24px 96px;
        }

        .page-head {
            margin-bottom: 36px;
        }

        .page-head h1 {
            font-family: 'Fraunces', serif;
            font-size: clamp(26px, 3.4vw, 32px);
            font-weight: 500;
            margin: 0 0 6px;
        }

        .page-head p {
            font-size: 14.5px;
            color: var(--ink-soft);
            margin: 0;
        }

        /* Empty state */
        .notice {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            font-size: 14.5px;
            line-height: 1.5;
            padding: 14px 16px;
            border-radius: 6px;
            background: #F1F0EC;
            border: 1px solid #DFDCD1;
            color: var(--ink-soft);
        }

        .notice::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--gold);
            margin-top: 6px;
            flex-shrink: 0;
        }

        .notice a {
            color: var(--gold-deep);
            font-weight: 600;
            text-decoration: underline;
        }

        /* ---------- Order card ---------- */
        .order-card {
            background: #fff;
            border: 1px solid var(--sand-line);
            border-radius: 10px;
            padding: 24px 28px;
            margin-bottom: 18px;
        }

        .order-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--sand-line);
            margin-bottom: 18px;
        }

        .order-head h5 {
            font-family: 'Fraunces', serif;
            font-size: 17px;
            font-weight: 500;
            margin: 0 0 4px;
        }

        .order-head .order-date {
            font-size: 13.5px;
            color: var(--ink-soft);
            margin: 0;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12.5px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .status-badge::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .status-badge.status-pending { background: #FBF3E6; color: var(--gold-deep); }
        .status-badge.status-pending::before { background: var(--gold); }

        .status-badge.status-confirmed { background: #EEF1F5; color: #3A4E63; }
        .status-badge.status-confirmed::before { background: #5C7999; }

        .status-badge.status-done { background: #F2F5EF; color: #3F4E3D; }
        .status-badge.status-done::before { background: var(--sage); }

        .order-body {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .order-address {
            font-size: 14.5px;
            color: var(--ink);
            max-width: 460px;
            line-height: 1.5;
        }

        .order-address strong {
            display: block;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--gold-deep);
            margin-bottom: 5px;
        }

        .order-total-block {
            text-align: right;
        }

        .order-total {
            font-family: 'Fraunces', serif;
            font-size: 19px;
            font-weight: 600;
            color: var(--ink);
            margin: 0 0 10px;
        }

        .btn-view {
            display: inline-block;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--cream);
            background: var(--ink);
            padding: 9px 18px;
            border-radius: 6px;
            text-decoration: none;
            transition: background 0.15s ease;
        }

        .btn-view:hover { background: #2A3444; }

        @media (max-width: 600px) {
            .order-card { padding: 20px; }
            .order-head { flex-direction: column; gap: 10px; }
            .order-body { flex-direction: column; align-items: flex-start; }
            .order-total-block { text-align: left; }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="nav">
        <div class="nav-inner">
            <a class="brand-mark" href="/">
                <span class="tag"></span>
                <span>Quý Shop</span>
            </a>
            <div class="nav-actions">
                <a href="/">Trang chủ</a>
                <form action="/logout" method="post" style="margin:0;">
                    <button class="nav-logout-btn" type="submit">Đăng xuất</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="wrap">
        <div class="page-head">
            <h1>Đơn hàng của tôi</h1>
            <p>Theo dõi trạng thái và lịch sử mua sắm tại Quý Shop.</p>
        </div>

        <div th:if="${#lists.isEmpty(orders)}" class="notice">
            Bạn chưa có đơn hàng nào. <a href="/products">Mua sắm ngay</a>
        </div>

        <div th:each="order : ${orders}" class="order-card">
            <div class="order-head">
                <div>
                    <h5>Đơn hàng #<span th:text="${order.id}"></span></h5>
                    <p class="order-date">Ngày đặt: <span th:text="${#calendars.format(new java.util.Date(order.createdAt), 'dd/MM/yyyy')}"></span></p>
                </div>
                <span class="status-badge"
                      th:classappend="${order.status == 'PENDING' ? 'status-pending' : order.status == 'CONFIRMED' ? 'status-confirmed' : 'status-done'}"
                      th:text="${order.status}"></span>
            </div>

            <div class="order-body">
                <div class="order-address">
                    <strong>Địa chỉ giao hàng</strong>
                    <span th:text="${order.shippingAddress}"></span>
                </div>
                <div class="order-total-block">
                    <p class="order-total" th:text="'₫' + ${#numbers.formatInteger(order.totalAmount, 0, 'COMMA')}"></p>
                    <a th:href="'/orders/' + ${order.id}" class="btn-view">Xem chi tiết</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
