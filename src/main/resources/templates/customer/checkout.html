<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác nhận thanh toán · Quý Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1C2430;
            --ink-soft: #4B5361;
            --cream: #FAF7F2;
            --sand: #EDE6D9;
            --sand-line: #DCD2BF;
            --gold: #B8873D;
            --gold-deep: #96692A;
            --clay: #B0402C;
            --sage: #5C6E5A;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            color: var(--ink);
            background: var(--cream);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a { color: inherit; text-decoration: none; }

        /* ---------- Navbar ---------- */
        .navbar {
            background: var(--ink);
            padding: 16px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-mark {
            display: flex;
            align-items: baseline;
            gap: 9px;
            text-decoration: none;
        }

        .brand-mark .tag {
            width: 10px;
            height: 10px;
            border: 1.5px solid var(--gold);
            border-radius: 2px;
            transform: rotate(45deg);
            position: relative;
            top: -1px;
        }

        .brand-mark span {
            font-family: 'Fraunces', serif;
            font-size: 20px;
            font-weight: 500;
            color: var(--cream);
        }

        .btn-back {
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            color: var(--ink);
            background: var(--cream);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .btn-back:hover { background: #EDE6D9; }

        /* ---------- Layout Container ---------- */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 24px 80px;
            width: 100%;
        }

        .page-header h1 {
            font-family: 'Fraunces', serif;
            font-size: 32px;
            font-weight: 500;
            margin: 0 0 32px;
        }

        /* ---------- Checkout Card ---------- */
        .checkout-card {
            background: #fff;
            border: 1px solid var(--sand-line);
            border-radius: 10px;
            padding: 40px;
        }

        .checkout-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--ink);
            margin: 0 0 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--sand-line);
        }

        /* ---------- Form Elements ---------- */
        .form-group { margin-bottom: 24px; }

        .form-label {
            display: block;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--sand-line);
            border-radius: 6px;
            font-family: inherit;
            font-size: 14.5px;
            color: var(--ink);
            background: #fff;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(184, 135, 61, 0.1);
        }

        textarea.form-control { resize: vertical; line-height: 1.5; }
        
        select.form-control { cursor: pointer; }

        /* ---------- QR Box ---------- */
        .qr-wrapper {
            display: flex;
            align-items: flex-start;
            height: 100%;
        }

        .qr-box {
            background: var(--cream);
            border: 2px dashed var(--sand-line);
            border-radius: 10px;
            padding: 32px 24px;
            text-align: center;
            width: 100%;
            transition: opacity 0.3s ease;
        }

        .qr-box h5 {
            font-family: 'Fraunces', serif;
            font-size: 18px;
            margin: 0 0 20px;
            color: var(--ink);
        }

        .qr-box img {
            width: 200px;
            height: 200px;
            object-fit: contain;
            background: #fff;
            border: 1px solid var(--sand-line);
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 16px;
        }

        .qr-box p {
            font-size: 13px;
            color: var(--ink-soft);
            line-height: 1.5;
            margin: 0;
        }

        /* ---------- Submit Button ---------- */
        .btn-submit {
            display: block;
            width: 100%;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            color: var(--cream);
            background: var(--ink);
            border: none;
            padding: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s ease;
            margin-top: 40px;
        }

        .btn-submit:hover { background: #2A3444; }

        @media (max-width: 768px) {
            .checkout-grid { grid-template-columns: 1fr; gap: 32px; }
            .checkout-card { padding: 24px; }
            .navbar { padding: 16px 20px; }
            .qr-wrapper { margin-top: -8px; }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a class="brand-mark" href="/">
            <span class="tag"></span>
            <span>Quý Shop</span>
        </a>
        <a href="/cart" class="btn-back">Quay lại giỏ hàng</a>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <div class="page-header">
            <h1>Xác nhận đơn hàng</h1>
        </div>

        <form action="/checkout" method="post" class="checkout-card">
            <div class="checkout-grid">
                
                <!-- Cột thông tin -->
                <div class="checkout-form">
                    <h2 class="section-title">Thông tin giao hàng</h2>
                    
                    <div class="form-group">
                        <label class="form-label">Địa chỉ nhận hàng *</label>
                        <textarea name="shippingAddress" class="form-control" rows="3" required th:text="${user.address}"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Ghi chú (Tùy chọn)</label>
                        <textarea name="notes" class="form-control" rows="2" placeholder="Ví dụ: Giao vào giờ hành chính, gọi trước khi giao..."></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Phương thức thanh toán</label>
                        <select name="paymentMethod" class="form-control" id="paymentMethod">
                            <option value="QR">Chuyển khoản qua mã QR (Khuyên dùng)</option>
                            <option value="COD">Thanh toán khi nhận hàng (COD)</option>
                        </select>
                    </div>
                </div>

                <!-- Cột QR Code -->
                <div class="qr-wrapper">
                    <div class="qr-box" id="qrBox">
                        <h5>Quét mã để thanh toán</h5>
                        <img src="/images/qr.jpg" alt="Mã QR thanh toán">
                        <p>Vui lòng chuyển khoản với nội dung là <strong>Số điện thoại</strong> của bạn. Đơn hàng sẽ được xử lý ngay sau khi nhận được thanh toán.</p>
                    </div>
                </div>

            </div>

            <button class="btn-submit" type="submit">Hoàn tất đặt hàng</button>
        </form>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const methodSelect = document.getElementById('paymentMethod');
            const qrBox = document.getElementById('qrBox');

            function toggleQR() {
                if (methodSelect.value === 'QR') {
                    qrBox.style.display = 'block';
                    // Timeout nhỏ để tạo hiệu ứng mượt mà nếu cần animation
                    setTimeout(() => { qrBox.style.opacity = '1'; }, 10);
                } else {
                    qrBox.style.opacity = '0';
                    setTimeout(() => { qrBox.style.display = 'none'; }, 300);
                }
            }

            methodSelect.addEventListener('change', toggleQR);
            toggleQR(); // Chạy lần đầu khi load trang
        });
    </script>
</body>
</html>
