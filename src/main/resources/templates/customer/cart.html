<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ Hàng - Quý Shop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .cart-item { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #667eea; }
        .cart-summary { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .btn-checkout { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Quý Shop</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/products">Sản Phẩm</a></li>
                    <li class="nav-item"><a class="nav-link" href="/orders">Đơn Hàng</a></li>
                </ul>
            </div>
            <div class="ms-auto">
                <form action="/logout" method="post" style="display: inline;">
                    <button class="btn btn-outline-light btn-sm" type="submit">Đăng Xuất</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h1 class="mb-4">🛒 Giỏ Hàng Của Bạn</h1>

        <div th:if="${items.isEmpty()}" class="alert alert-info text-center">
            <h5>Giỏ hàng trống</h5>
            <p>Hãy <a href="/products">mua sắm ngay</a> để thêm sản phẩm vào giỏ hàng</p>
        </div>

        <div th:if="${!items.isEmpty()}" class="row">
            <div class="col-lg-8">
                <div th:each="item : ${items}" class="cart-item">
                    <div class="row align-items-center">
                        <div class="col-md-2">
                            <img th:src="${item.product.imageUrl}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 8px;">
                        </div>
                        <div class="col-md-4">
                            <h5 th:text="${item.product.name}"></h5>
                            <p class="text-muted small" th:text="${item.product.description}"></p>
                        </div>
                        <div class="col-md-2">
                            <p>Giá: <strong th:text="'₫' + ${#numbers.formatInteger(item.unitPrice, 0, 'COMMA')}"></strong></p>
                        </div>
                        <div class="col-md-2">
                            <form th:action="'/cart/update/' + ${item.id}" method="post" style="display: flex; gap: 5px;">
                                <input type="number" name="quantity" class="form-control form-control-sm" th:value="${item.quantity}" min="1" max="100" style="width: 60px;">
                                <button type="submit" class="btn btn-sm btn-primary">✓</button>
                            </form>
                        </div>
                        <div class="col-md-2 text-end">
                            <p>Tổng: <strong th:text="'₫' + ${#numbers.formatInteger(item.unitPrice * item.quantity, 0, 'COMMA')}"></strong></p>
                            <form th:action="'/cart/remove/' + ${item.id}" method="post" style="display: inline;">
                                <button type="submit" class="btn btn-sm btn-danger">🗑️</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="cart-summary">
                    <h4 class="mb-4">📊 Tóm Tắt Giỏ Hàng</h4>
                    <div class="row mb-3">
                        <div class="col-6">Số sản phẩm:</div>
                        <div class="col-6 text-end"><strong th:text="${items.size()}"></strong></div>
                    </div>
                    <hr>
                    <div class="row mb-3">
                        <div class="col-6">Tổng cộng:</div>
                        <div class="col-6 text-end">
                            <h5 th:text="'₫' + ${#numbers.formatInteger(total, 0, 'COMMA')}" class="text-success"></h5>
                        </div>
                    </div>
                    <button class="btn btn-checkout w-100 text-white btn-lg mb-2">💳 Thanh Toán</button>
                    <a href="/products" class="btn btn-outline-primary w-100">← Tiếp Tục Mua Sắm</a>
                    <form th:action="@{/cart/clear}" method="post" class="mt-2">
                        <button type="submit" class="btn btn-outline-danger w-100" onclick="return confirm('Xóa tất cả giỏ hàng?')">🗑️ Xóa Giỏ</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
