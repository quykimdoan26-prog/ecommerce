<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Đơn Hàng - Quý Shop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .detail-card { background: white; padding: 30px; border-radius: 12px; margin-bottom: 20px; }
        .item-row { border-bottom: 1px solid #eee; padding: 15px 0; }
        .item-row:last-child { border-bottom: none; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Quý Shop</a>
            <div class="ms-auto">
                <a href="/orders" class="btn btn-light btn-sm">← Quay Lại</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h1 class="mb-4">Đơn Hàng #<span th:text="${order.id}"></span></h1>

        <div class="detail-card">
            <h5>📦 Thông Tin Đơn Hàng</h5>
            <div class="row">
                <div class="col-md-6">
                    <p><strong>Trạng Thái:</strong> <span class="badge bg-success" th:text="${order.status}"></span></p>
                    <p><strong>Khách Hàng:</strong> <span th:text="${order.user.fullName}"></span></p>
                    <p><strong>Email:</strong> <span th:text="${order.user.email}"></span></p>
                </div>
                <div class="col-md-6">
                    <p><strong>Ngày Tạo:</strong> <span th:text="${#calendars.format(new java.util.Date(order.createdAt), 'dd/MM/yyyy HH:mm')}"></span></p>
                    <p><strong>Địa Chỉ Giao:</strong> <span th:text="${order.shippingAddress}"></span></p>
                    <p><strong>Ghi Chú:</strong> <span th:text="${order.notes ?: 'N/A'}"></span></p>
                </div>
            </div>
        </div>

        <div class="detail-card">
            <h5>📋 Các Sản Phẩm</h5>
            <div th:each="item : ${items}" class="item-row">
                <div class="row align-items-center">
                    <div class="col-md-2">
                        <img th:src="${item.product.imageUrl}" style="width: 60px; height: 60px; object-fit: cover; border-radius: 6px;">
                    </div>
                    <div class="col-md-4">
                        <strong th:text="${item.product.name}"></strong>
                        <p class="text-muted small" th:text="${item.product.description}"></p>
                    </div>
                    <div class="col-md-2">
                        <p>Số Lượng: <strong th:text="${item.quantity}"></strong></p>
                    </div>
                    <div class="col-md-2">
                        <p>Giá: <strong th:text="'₫' + ${#numbers.formatInteger(item.unitPrice, 0, 'COMMA')}"></strong></p>
                    </div>
                    <div class="col-md-2 text-end">
                        <p>Tổng: <strong th:text="'₫' + ${#numbers.formatInteger(item.totalPrice, 0, 'COMMA')}"></strong></p>
                    </div>
                </div>
            </div>
        </div>

        <div class="detail-card">
            <div class="row">
                <div class="col-md-8"></div>
                <div class="col-md-4">
                    <h5 class="text-end">Tổng Tiền Đơn Hàng</h5>
                    <h3 class="text-end text-success" th:text="'₫' + ${#numbers.formatInteger(order.totalAmount, 0, 'COMMA')}"></h3>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
