<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài khoản khách hàng · Quý Shop Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1C2430;
            --ink-soft: #4B5361;
            --cream: #FAF7F2;
            --sand: #EDE6D9;
            --sand-line: #DCD2BF;
            --gold: #B8873D;
            --gold-deep: #96692A;
            --clay: #B0402C;
            --sage: #5C6E5A;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            color: var(--ink);
            background: var(--cream);
        }

        a { color: inherit; }

        .layout {
            display: grid;
            grid-template-columns: 232px 1fr;
            min-height: 100vh;
        }

        /* ---------- Sidebar ---------- */
        .sidebar {
            background: var(--ink);
            padding: 28px 20px;
            display: flex;
            flex-direction: column;
        }

        .brand-mark {
            display: flex;
            align-items: baseline;
            gap: 9px;
            text-decoration: none;
            margin-bottom: 8px;
            padding: 0 6px;
        }

        .brand-mark .tag {
            width: 10px;
            height: 10px;
            border: 1.5px solid var(--gold);
            border-radius: 2px;
            transform: rotate(45deg);
            position: relative;
            top: -1px;
        }

        .brand-mark span {
            font-family: 'Fraunces', serif;
            font-size: 18px;
            font-weight: 500;
            color: var(--cream);
        }

        .sidebar-tag {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--gold);
            padding: 0 6px;
            margin-bottom: 30px;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex: 1;
        }

        .sidebar-nav a {
            font-size: 14.5px;
            color: rgba(250, 247, 242, 0.72);
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 6px;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .sidebar-nav a:hover { background: rgba(250, 247, 242, 0.06); color: var(--cream); }

        .sidebar-nav a.active {
            background: rgba(184, 135, 61, 0.15);
            color: var(--cream);
            font-weight: 600;
        }

        .sidebar-divider {
            height: 1px;
            background: rgba(250, 247, 242, 0.1);
            margin: 16px 6px;
        }

        .sidebar-nav a.exit { color: rgba(250, 247, 242, 0.55); }

        .btn-logout {
            width: 100%;
            margin-top: 8px;
            padding: 10px 12px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            color: var(--ink);
            background: var(--cream);
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-logout:hover { background: #EDE6D9; }

        /* ---------- Main & Topbar ---------- */
        .main { display: flex; flex-direction: column; min-width: 0; }

        .topbar {
            padding: 32px 40px;
            border-bottom: 1px solid var(--sand-line);
        }

        .topbar h1 {
            font-family: 'Fraunces', serif;
            font-size: 26px;
            font-weight: 500;
            margin: 0 0 6px;
        }

        .topbar p {
            font-size: 14.5px;
            color: var(--ink-soft);
            margin: 0;
        }

        .content { padding: 28px 40px 60px; }

        /* ---------- Table ---------- */
        .table-card {
            background: #fff;
            border: 1px solid var(--sand-line);
            border-radius: 10px;
            overflow: hidden;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 800px;
        }

        thead th {
            text-align: left;
            font-size: 11.5px;
            font-weight: 600;
            letter-spacing: 0.03em;
            color: var(--ink-soft);
            padding: 14px 18px;
            background: var(--sand);
            border-bottom: 1px solid var(--sand-line);
            white-space: nowrap;
        }

        tbody td {
            padding: 16px 18px;
            border-bottom: 1px solid var(--sand-line);
            vertical-align: middle;
        }

        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: #FBFAF7; }

        .name-cell { font-weight: 600; color: var(--ink); margin-bottom: 2px; }
        .sub-text { font-size: 12.5px; color: var(--ink-soft); }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .status-badge::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .status-badge.on { background: #F2F5EF; color: #3F4E3D; }
        .status-badge.on::before { background: var(--sage); }

        .status-badge.off { background: #FBF0ED; color: #7A2E1D; }
        .status-badge.off::before { background: var(--clay); }

        /* ---------- Inline Forms ---------- */
        .role-form {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 0;
        }

        .select-role {
            font-family: inherit;
            font-size: 13px;
            padding: 6px 8px;
            border: 1px solid var(--sand-line);
            border-radius: 6px;
            background: #fff;
            color: var(--ink);
            outline: none;
            transition: border-color 0.15s ease;
        }

        .select-role:focus { border-color: var(--gold); }

        .btn-mini {
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 10px;
            border: 1px solid var(--sand-line);
            border-radius: 6px;
            background: var(--cream);
            color: var(--ink);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-mini:hover { background: var(--sand); }

        .action-cell form { margin: 0; }

        .btn-action {
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            padding: 7px 13px;
            cursor: pointer;
            border: 1px solid var(--sand-line);
            background: #fff;
            transition: all 0.15s ease;
        }

        .btn-lock { color: var(--clay); }
        .btn-lock:hover { border-color: var(--clay); background: #FBF0ED; }

        .btn-unlock { color: var(--sage); }
        .btn-unlock:hover { border-color: var(--sage); background: #F2F5EF; }

        .role-text { font-weight: 500; color: var(--ink-soft); }

        @media (max-width: 860px) {
            .layout { grid-template-columns: 1fr; }
            .topbar, .content { padding-left: 24px; padding-right: 24px; }
        }
    </style>
</head>
<body>
    <div class="layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <a class="brand-mark" href="/">
                <span class="tag"></span>
                <span>Quý Shop</span>
            </a>
            <p class="sidebar-tag">QUẢN TRỊ</p>

            <nav class="sidebar-nav">
                <a href="/admin/dashboard">Dashboard</a>
                <a href="/admin/products">Quản lý sản phẩm</a>
                <a href="/admin/orders">Quản lý đơn hàng</a>
                <a href="/admin/users" class="active">Tài khoản khách hàng</a>

                <div class="sidebar-divider"></div>
                <a href="/" class="exit">Về trang chủ</a>
            </nav>

            <form action="/logout" method="post">
                <button class="btn-logout" type="submit">Đăng xuất</button>
            </form>
        </aside>

        <!-- Main -->
        <div class="main">
            <div class="topbar">
                <h1>Tài khoản khách hàng</h1>
                <p>Quản lý phân quyền và trạng thái hoạt động của người dùng.</p>
            </div>

            <div class="content">
                <div class="table-card">
                    <table>
                        <thead>
                            <tr>
                                <th>Tài khoản</th>
                                <th>Liên hệ</th>
                                <th>Vai trò</th>
                                <th>Trạng thái</th>
                                <th>Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td>
                                    <div class="name-cell" th:text="${user.fullName}"></div>
                                    <div class="sub-text" th:text="${user.username}"></div>
                                </td>
                                <td>
                                    <div th:text="${user.email}"></div>
                                    <div class="sub-text" th:text="${user.phone}"></div>
                                </td>
                                <td>
                                    <!-- Form cấp quyền (Chỉ Admin) -->
                                    <form th:action="'/admin/users/' + ${user.id} + '/role'" method="post" class="role-form" sec:authorize="hasRole('ADMIN')">
                                        <select name="role" class="select-role">
                                            <option value="CUSTOMER" th:selected="${user.role == 'CUSTOMER'}">Khách hàng</option>
                                            <option value="STAFF" th:selected="${user.role == 'STAFF'}">Nhân viên</option>
                                            <option value="ADMIN" th:selected="${user.role == 'ADMIN'}">Admin</option>
                                        </select>
                                        <button type="submit" class="btn-mini">Lưu</button>
                                    </form>
                                    
                                    <!-- Hiển thị text thường nếu không phải Admin -->
                                    <span class="role-text" sec:authorize="!hasRole('ADMIN')" th:text="${user.role}"></span>
                                </td>
                                <td>
                                    <span class="status-badge" th:classappend="${user.status ? 'on' : 'off'}"
                                          th:text="${user.status ? 'Đang hoạt động' : 'Đã khóa'}"></span>
                                </td>
                                <td class="action-cell">
                                    <form th:action="'/admin/users/' + ${user.id} + '/status'" method="post">
                                        <input type="hidden" name="status" th:value="${!user.status}">
                                        <button type="submit" class="btn-action" 
                                                th:classappend="${user.status ? 'btn-lock' : 'btn-unlock'}"
                                                th:text="${user.status ? 'Khóa tài khoản' : 'Mở khóa'}"></button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
