<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sản Phẩm - Quý Shop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .sidebar a { color: white; text-decoration: none; display: block; padding: 10px 15px; margin: 5px 0; border-radius: 8px; transition: 0.3s; }
        .sidebar a:hover { background: rgba(255,255,255,0.2); }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px 0; margin-bottom: 30px; }
        .table { background: white; border-radius: 8px; overflow: hidden; }
        .btn-sm { border-radius: 6px; }
    </style>
</head>
<body>
    <div class="row no-gutters">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar">
            <h4 class="text-white mb-4">📊 Admin</h4>
            <a href="/admin/dashboard">Dashboard</a>
            <a href="/admin/products">Quản Lý Sản Phẩm</a>
            <a href="/admin/orders">Quản Lý Đơn Hàng</a>
            <a href="/">Về Trang Chủ</a>
            <hr class="bg-white">
            <form action="/logout" method="post">
                <button class="btn btn-light w-100" type="submit">Đăng Xuất</button>
            </form>
        </div>

        <!-- Main Content -->
        <div class="col-md-10">
            <div class="header">
                <div class="container">
                    <h1>📦 Quản Lý Sản Phẩm</h1>
                </div>
            </div>

            <div class="container mt-4 mb-4">
                <a href="/admin/products/add" class="btn btn-success mb-3">➕ Thêm Sản Phẩm Mới</a>
                
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Tên Sản Phẩm</th>
                                <th>Giá</th>
                                <th>Số Lượng</th>
                                <th>Danh Mục</th>
                                <th>Trạng Thái</th>
                                <th>Hành Động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="product : ${products}">
                                <td th:text="${product.id}"></td>
                                <td th:text="${product.name}"></td>
                                <td th:text="'₫' + ${#numbers.formatInteger(product.price, 0, 'COMMA')}"></td>
                                <td th:text="${product.quantity}"></td>
                                <td th:text="${product.category.name}"></td>
                                <td>
                                    <span class="badge" th:classappend="${product.status ? 'bg-success' : 'bg-danger'}" 
                                          th:text="${product.status ? 'Hoạt Động' : 'Tắt'}"></span>
                                </td>
                                <td>
                                    <a th:href="'/admin/products/edit/' + ${product.id}" class="btn btn-info btn-sm">✏️ Sửa</a>
                                    <form th:action="'/admin/products/delete/' + ${product.id}" method="post" style="display: inline;">
                                        <button class="btn btn-danger btn-sm" type="submit" onclick="return confirm('Xác nhận xóa?')">🗑️ Xóa</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
