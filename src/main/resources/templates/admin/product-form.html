<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm/Sửa Sản Phẩm - Quý Shop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .sidebar a { color: white; text-decoration: none; display: block; padding: 10px 15px; margin: 5px 0; border-radius: 8px; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px 0; margin-bottom: 30px; }
        .form-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .form-control, .form-select { border-radius: 8px; }
        .form-control:focus, .form-select:focus { border-color: #667eea; box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25); }
    </style>
</head>
<body>
    <div class="row no-gutters">
        <div class="col-md-2 sidebar">
            <h4 class="text-white mb-4">📊 Admin</h4>
            <a href="/admin/dashboard">Dashboard</a>
            <a href="/admin/products">Quản Lý Sản Phẩm</a>
            <a href="/admin/orders">Quản Lý Đơn Hàng</a>
            <a href="/">Về Trang Chủ</a>
            <hr class="bg-white">
            <form action="/logout" method="post">
                <button class="btn btn-light w-100" type="submit">Đăng Xuất</button>
            </form>
        </div>

        <div class="col-md-10">
            <div class="header">
                <div class="container">
                    <h1>➕ Thêm/Sửa Sản Phẩm</h1>
                </div>
            </div>

            <div class="container mt-4 mb-5" style="max-width: 600px;">
                <div class="form-card">
                    <form method="post" th:action="@{/admin/products/save}" th:object="${product}">
                        <input type="hidden" th:field="*{id}">
                        
                        <div class="mb-3">
                            <label for="name" class="form-label">Tên Sản Phẩm *</label>
                            <input type="text" class="form-control" th:field="*{name}" required>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Mô Tả</label>
                            <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="price" class="form-label">Giá (₫) *</label>
                            <input type="number" class="form-control" th:field="*{price}" step="1000" min="0" required>
                        </div>

                        <div class="mb-3">
                            <label for="quantity" class="form-label">Số Lượng *</label>
                            <input type="number" class="form-control" th:field="*{quantity}" min="0" required>
                        </div>

                        <div class="mb-3">
                            <label for="category_id" class="form-label">Danh Mục *</label>
                            <select class="form-select" name="category.id" required>
                                <option value="">-- Chọn Danh Mục --</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="imageUrl" class="form-label">URL Hình Ảnh</label>
                            <input type="text" class="form-control" th:field="*{imageUrl}" placeholder="https://via.placeholder.com/300">
                        </div>

                        <div class="mb-3">
                            <label for="status" class="form-label">Trạng Thái</label>
                            <select class="form-select" th:field="*{status}">
                                <option value="true">Hoạt Động</option>
                                <option value="false">Tắt</option>
                            </select>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">💾 Lưu Sản Phẩm</button>
                            <a href="/admin/products" class="btn btn-secondary">❌ Hủy</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
