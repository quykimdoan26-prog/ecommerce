<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Đơn Hàng - Quý Shop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .sidebar a { color: white; text-decoration: none; display: block; padding: 10px 15px; margin: 5px 0; border-radius: 8px; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px 0; margin-bottom: 30px; }
        .table { background: white; border-radius: 8px; }
        .status-badge { border-radius: 20px; padding: 5px 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="row no-gutters">
        <div class="col-md-2 sidebar">
            <h4 class="text-white mb-4">📊 Admin</h4>
            <a href="/admin/dashboard">Dashboard</a>
            <a href="/admin/products">Quản Lý Sản Phẩm</a>
            <a href="/admin/orders">Quản Lý Đơn Hàng</a>
            <a href="/">Về Trang Chủ</a>
            <hr class="bg-white">
            <form action="/logout" method="post">
                <button class="btn btn-light w-100" type="submit">Đăng Xuất</button>
            </form>
        </div>

        <div class="col-md-10">
            <div class="header">
                <div class="container">
                    <h1>📋 Quản Lý Đơn Hàng</h1>
                </div>
            </div>

            <div class="container mt-4 mb-4">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Mã Đơn</th>
                                <th>Khách Hàng</th>
                                <th>Tổng Tiền</th>
                                <th>Trạng Thái</th>
                                <th>Ngày Tạo</th>
                                <th>Hành Động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="order : ${orders}">
                                <td>#<span th:text="${order.id}"></span></td>
                                <td th:text="${order.user.fullName}"></td>
                                <td th:text="'₫' + ${#numbers.formatInteger(order.totalAmount, 0, 'COMMA')}"></td>
                                <td>
                                    <span class="status-badge" 
                                          th:classappend="${order.status == 'PENDING' ? 'bg-warning' : 'bg-success'}"
                                          th:text="${order.status}"></span>
                                </td>
                                <td th:text="${#calendars.format(new java.util.Date(order.createdAt), 'dd/MM/yyyy HH:mm')}"></td>
                                <td>
                                    <a th:href="'/orders/' + ${order.id}" class="btn btn-info btn-sm">👁️ Xem</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
